<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Passagem de Turno - Last-Mile</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* ===================== Formulário ===================== */
        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f0f2f5;
            padding: 15px;
            margin: 0;
        }

        .form-container {
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 520px;
            margin: auto;
        }

        .top-grid { display: block; }
        .sections-grid { display: block; }
        .field-block, .section-block, .desembaraco-block { min-width: 0; }

        @media (min-width: 900px) {
            .form-container { max-width: 1120px; }

            .top-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 24px;
            }

            .desembaraco-block { max-width: 640px; }

            .sections-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 30px;
                align-items: start;
            }
        }

        h2 {
            text-align: center;
            color: #333;
            font-size: 22px;
            margin: 10px 0 0;
        }

        h3 {
            font-size: 16px;
            color: #007bff;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
            margin-top: 28px;
        }

        .sub-title {
            font-size: 14px;
            font-weight: 700;
            color: #333;
            margin: 20px 0 0;
            padding: 7px 10px;
            border-radius: 6px;
        }

        .sub-title-rec { background: #fff1e0; border-left: 4px solid #f39c12; color: #8a4b00; }
        .sub-title-exp { background: #e8f8ee; border-left: 4px solid #2ecc71; color: #1e6b36; }

        label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #555;
            margin-top: 12px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px; /* evita zoom automático no iOS */
            background-color: #fff;
            color: #222;
        }

        textarea { resize: vertical; min-height: 72px; }

        .form-container.validacao-ativa input:invalid,
        .form-container.validacao-ativa select:invalid,
        .form-container.validacao-ativa textarea:invalid {
            border-color: #d9534f;
            background-color: #fff8f8;
        }

        .required-note {
            font-size: 12px;
            color: #777;
            text-align: center;
            margin-bottom: 8px;
        }

        .hidden-field {
            display: none;
            padding-left: 10px;
            border-left: 3px solid #007bff;
            margin-top: 10px;
        }

        .dynamic-list { margin-top: 8px; }

        .truck-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-left: 3px solid #007bff;
            border-radius: 8px;
            padding: 6px 12px 14px;
            margin-top: 10px;
        }

        .truck-card-title {
            font-size: 13px;
            font-weight: 700;
            color: #007bff;
            margin: 4px 0 0;
        }

        .truck-card-rec { background: #fffaf3; border-color: #f3d2a5; border-left-color: #f39c12; }
        .truck-card-exp { background: #f7fcf9; border-color: #b9e6c9; border-left-color: #2ecc71; }
        .truck-card-rec .truck-card-title { color: #b5651d; }
        .truck-card-exp .truck-card-title { color: #1e8449; }

        .truck-card label {
            font-size: 12px;
            margin-top: 9px;
        }

        .time-row {
            display: flex;
            align-items: stretch;
            gap: 6px;
        }

        .time-row input { flex: 1; min-width: 0; }

        .btn-agora {
            width: auto;
            flex: 0 0 auto;
            padding: 0 12px;
            margin-top: 5px;
            font-size: 12px;
            font-weight: 700;
            background: #e9ecef;
            color: #333;
            box-shadow: none;
            border-radius: 8px;
        }

        .btn-agora:active { background: #d6dbe0; }

        .btn-container {
            position: sticky;
            bottom: 0;
            background: #fff;
            padding: 10px 0;
            margin-top: 30px;
            border-top: 1px solid #eee;
        }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-row #btnGerar { flex: 2 1 200px; }
        .btn-row #btnLimpar {
            flex: 1 1 110px;
            background: #e9ecef;
            color: #333;
            box-shadow: none;
        }

        .btn-row #btnLimpar:active { background: #d6dbe0; }

        button {
            width: 100%;
            padding: 15px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 123, 255, 0.3);
        }

        button:active { background: #0056b3; }
        button:disabled { background: #8ab8e8; box-shadow: none; cursor: wait; }

        /* ===================== Área da imagem ===================== */
        #canvasWrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 640px;
            height: 0;
            overflow: hidden;
            visibility: hidden;
            pointer-events: none;
            z-index: -100;
        }

        #canvasArea {
            box-sizing: border-box;
            width: 640px;
            padding: 28px 30px 30px;
            background: #ffffff;
            border-top: 8px solid #007bff;
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            font-size: 12px;
            line-height: 1.4;
            color: #333;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        #canvasArea * { box-sizing: border-box; }

        .rp-title {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
            color: #1b1f24;
            letter-spacing: 0.2px;
        }

        .rp-date {
            text-align: center;
            font-size: 11px;
            color: #777;
            margin-top: 4px;
        }

        .rp-meta {
            margin-top: 12px;
            padding: 6px 9px;
            background: #f5f7fa;
            border: 1px solid #e6e9ee;
            border-radius: 6px;
            font-size: 11px;
        }

        .rp-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin: 2px 0;
        }

        .rp-meta-row > span:first-child { color: #555; padding-right: 12px; }
        .rp-meta-val { font-weight: 700; color: #111; text-align: right; word-break: break-word; }

        .rp-summary {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .rp-summary-item {
            flex: 1;
            padding: 6px 9px;
            border-radius: 6px;
            font-size: 10.5px;
            line-height: 1.35;
        }

        .rp-summary-label {
            display: block;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .rp-summary-val { font-weight: 600; }

        .rp-summary-rec { background: #fff1e0; border-left: 3px solid #f39c12; color: #8a4b00; }
        .rp-summary-exp { background: #e8f8ee; border-left: 3px solid #2ecc71; color: #1e6b36; }

        .rp-section { margin-top: 12px; }

        .rp-section-title {
            font-size: 12px;
            font-weight: 700;
            color: #007bff;
            text-transform: uppercase;
            border-bottom: 1px solid #e6e9ee;
            padding-bottom: 4px;
            margin-bottom: 7px;
        }

        .rp-title-rec { color: #d97706; border-bottom-color: #f3c98b; }
        .rp-title-exp { color: #1e8449; border-bottom-color: #a9dfbf; }

        .rp-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .rp-label { color: #555; padding-right: 12px; }
        .rp-value {
            font-weight: 600;
            color: #111;
            text-align: right;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .rp-ok { color: #28a745; }
        .rp-alert { color: #d9534f; }
        .rp-warn { color: #d39e00; }

        .rp-detail {
            background: #fdf5f5;
            border-left: 2px solid #d9534f;
            padding: 6px 8px;
            margin: 5px 0 8px;
            font-size: 11px;
            color: #444;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .rp-company {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
            color: #111;
            padding: 4px 7px;
            margin: 9px 0 4px;
        }

        .rp-company.rp-rec {
            background: #fff1e0;
            border-left: 3px solid #f39c12;
            color: #8a4b00;
        }

        .rp-company.rp-exp {
            background: #e8f8ee;
            border-left: 3px solid #2ecc71;
            color: #1e6b36;
        }

        .rp-company-sub { font-size: 10px; font-weight: 600; }
        .rp-company.rp-rec .rp-company-sub { color: #b5651d; }
        .rp-company.rp-exp .rp-company-sub { color: #2f7d4c; }

        .rp-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            margin: 0 0 2px;
            font-size: 10.5px;
        }

        .rp-table th {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            text-align: center;
            padding: 4px 4px;
            white-space: nowrap;
        }

        .rp-table td {
            padding: 3px 4px;
            border-bottom: 1px solid #eceff3;
            color: #333;
            text-align: center;
            vertical-align: middle;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .rp-table-rec th {
            background: #ffe7c7;
            color: #9a5200;
            border-bottom: 1px solid #f0c07a;
        }

        .rp-table-exp th {
            background: #daf3e3;
            color: #1e6b36;
            border-bottom: 1px solid #a9dfbf;
        }

        .rp-table-rec tr.rp-row-even td { background: #fffaf3; }
        .rp-table-exp tr.rp-row-even td { background: #f7fcf9; }

        .rp-table td.rp-cell-placa { font-weight: 700; color: #111; white-space: nowrap; }
        .rp-table tr:last-child td { border-bottom: none; }

        .rp-empty {
            font-size: 10px;
            color: #888;
            font-style: italic;
            padding: 1px 0 3px;
        }

        .rp-subtotal {
            font-size: 10px;
            color: #555;
            text-align: right;
            margin-top: 2px;
        }

        .rp-obs {
            margin-top: 7px;
            padding: 6px 9px;
            border-radius: 6px;
            font-size: 10.5px;
            line-height: 1.35;
            color: #444;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .rp-obs-label {
            display: block;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .rp-obs-rec { background: #fff8ef; border-left: 3px solid #f39c12; }
        .rp-obs-rec .rp-obs-label { color: #9a5200; }
        .rp-obs-exp { background: #f1fbf5; border-left: 3px solid #2ecc71; }
        .rp-obs-exp .rp-obs-label { color: #1e6b36; }

        .rp-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            border-top: 1px dashed #ccc;
            padding-top: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #333;
        }

        .rp-total-val { color: #28a745; }

        /* ===================== Prévia / download ===================== */
        [hidden] { display: none !important; }

        .preview-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 1000;
        }

        .preview-modal {
            background: #fff;
            border-radius: 12px;
            width: 100%;
            max-width: 720px;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .preview-header {
            padding: 14px 16px;
            font-weight: 700;
            font-size: 16px;
            color: #333;
            border-bottom: 1px solid #eee;
        }

        .preview-body {
            padding: 12px;
            overflow: auto;
            background: #f0f2f5;
            -webkit-overflow-scrolling: touch;
        }

        .preview-body img {
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid #ddd;
            background: #fff;
        }

        .preview-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px 16px 8px;
            border-top: 1px solid #eee;
        }

        .preview-actions button {
            flex: 1 1 140px;
            padding: 12px;
            font-size: 15px;
        }

        .preview-actions .secondary {
            background: #6c757d;
            box-shadow: none;
        }

        .preview-hint {
            padding: 0 16px 12px;
            font-size: 12px;
            color: #777;
            line-height: 1.35;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Passagem de Turno - Last-Mile</h2>

    <div class="top-grid">
        <div class="field-block">
            <label for="f_turno">Turno:</label>
            <select id="f_turno" required>
                <option value="Turno 1">Turno 1</option>
                <option value="Turno 2">Turno 2</option>
                <option value="Turno 3">Turno 3</option>
            </select>
        </div>

        <div class="field-block">
            <label for="f_responsavel">Responsável por Preenchimento:</label>
            <input type="text" id="f_responsavel" placeholder="Nome do responsável" autocomplete="name" required>
        </div>
    </div>

    <h3>Last-Mile</h3>

    <div class="desembaraco-block">
        <label for="f_desembaraco">Problemas com o desembaraço?</label>
        <select id="f_desembaraco" onchange="toggleVisibilidade('f_desembaraco', 'box_desembaraco', 'Sim')" required>
            <option value="Não">Não</option>
            <option value="Sim">Sim</option>
        </select>
        <div id="box_desembaraco" class="hidden-field">
            <textarea id="f_desembaraco_detalhe" rows="3" placeholder="Descreva os problemas (ex: lentidão acima de 8h no desembaraço, problemas no sistema da RFB...)"></textarea>
        </div>
    </div>

    <div class="sections-grid">
        <div class="section-block">
            <div class="sub-title sub-title-rec">Carretas Recebidas</div>

            <label for="f_qtd_jt_rec">Qtd de Carretas J&amp;T - Recebidas:</label>
            <input type="number" id="f_qtd_jt_rec" value="0" min="0" max="99" inputmode="numeric" required oninput="gerarCarretas('rec', 'jt')">
            <div id="container_rec_jt" class="dynamic-list"></div>

            <label for="f_qtd_imile_rec">Qtd de Carretas iMile - Recebidas:</label>
            <input type="number" id="f_qtd_imile_rec" value="0" min="0" max="99" inputmode="numeric" required oninput="gerarCarretas('rec', 'imile')">
            <div id="container_rec_imile" class="dynamic-list"></div>

            <label for="f_obs_rec">Observações do Recebimento (opcional):</label>
            <textarea id="f_obs_rec" rows="3" placeholder="Registre ocorrências ou pendências, se houver."></textarea>
        </div>

        <div class="section-block">
            <div class="sub-title sub-title-exp">Carretas Expedidas</div>

            <label for="f_qtd_jt_exp">Qtd de Carretas J&amp;T - Expedidas:</label>
            <input type="number" id="f_qtd_jt_exp" value="0" min="0" max="99" inputmode="numeric" required oninput="gerarCarretas('exp', 'jt')">
            <div id="container_exp_jt" class="dynamic-list"></div>

            <label for="f_qtd_imile_exp">Qtd de Carretas iMile - Expedidas:</label>
            <input type="number" id="f_qtd_imile_exp" value="0" min="0" max="99" inputmode="numeric" required oninput="gerarCarretas('exp', 'imile')">
            <div id="container_exp_imile" class="dynamic-list"></div>

            <label for="f_obs_exp">Observações da Expedição (opcional):</label>
            <textarea id="f_obs_exp" rows="3" placeholder="Registre ocorrências ou pendências, se houver."></textarea>
        </div>
    </div>

    <div class="btn-container">
        <div class="required-note">Todos os campos são obrigatórios, exceto as observações.</div>
        <div class="btn-row">
            <button type="button" id="btnLimpar">Limpar</button>
            <button type="button" id="btnGerar">Gerar Relatório de Turno</button>
        </div>
    </div>
</div>

<!-- Relatório usado para gerar a imagem -->
<div id="canvasWrapper" aria-hidden="true">
    <div id="canvasArea">
        <div class="rp-title">Passagem de Turno - Last-Mile</div>
        <div class="rp-date" id="rp_data"></div>

        <div class="rp-meta">
            <div class="rp-meta-row">
                <span>Turno</span>
                <span class="rp-meta-val" id="rp_turno">-</span>
            </div>
            <div class="rp-meta-row">
                <span>Responsável por Preenchimento</span>
                <span class="rp-meta-val" id="rp_responsavel">-</span>
            </div>
        </div>

        <div class="rp-summary">
            <div class="rp-summary-item rp-summary-rec">
                <span class="rp-summary-label">Recebidas</span>
                <span class="rp-summary-val" id="rp_resumo_rec">0 carretas</span>
            </div>
            <div class="rp-summary-item rp-summary-exp">
                <span class="rp-summary-label">Expedidas</span>
                <span class="rp-summary-val" id="rp_resumo_exp">0 carretas</spa
